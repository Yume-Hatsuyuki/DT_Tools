name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号（例如 v*.*.*，也支持 v*.*.*.*）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 校验发布来源分支
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$REF_NAME" != "main" ]; then
              echo "::error::手动发布必须在 main 上触发，当前分支是「$REF_NAME」。"
              exit 1
            fi
          else
            git fetch origin main
            if ! git merge-base --is-ancestor "$SHA" origin/main; then
              echo "::error::tag（$REF_NAME）不在 main 历史中，已阻止发布。"
              exit 1
            fi
          fi

      - name: 确定版本号
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?) ]]; then
            echo "::error::tag 须以 vMAJOR.MINOR.PATCH[.BUILD] 开头（例如 v1.0.0 或 v1.0.0.1），当前为「$TAG」"
            exit 1
          fi
          # 编译用的版本号必须是纯数字（BepInEx / System.Version 不支持后缀），
          # 只取匹配到的 v数字.数字.数字(.数字)? 前缀，后面不管跟什么（-c2 / _b2 / 中文 / 空格等）一律丢弃。
          ASSEMBLY_VERSION="${BASH_REMATCH[1]}"
          # 完整构建版本：去掉 v 前缀，只保留 0-9 A-Z a-z . _ -（+ 会被 SDK 当成元数据分隔符，必须剔除）。
          # 写入 InformationalVersion，运行时更新检测据此识别同数字版本的重建包（如 2.0.0.10-v2）。
          INFO_VERSION="$(printf '%s' "${TAG#v}" | tr -cd 'A-Za-z0-9._-')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$ASSEMBLY_VERSION" >> "$GITHUB_OUTPUT"
          echo "informational=$INFO_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          package-manager-cache: false
          cache-dependency-path: webui-src/package-lock.json

      - name: Build WebUI
        working-directory: webui-src
        run: |
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DT_Tools/DT_Tools.csproj

      - name: Build
        env:
          ASSEMBLY_VERSION: ${{ steps.ver.outputs.version }}
          INFO_VERSION: ${{ steps.ver.outputs.informational }}
        run: |
          dotnet build DT_Tools/DT_Tools.csproj -c Release --no-restore \
            -p:Version="$ASSEMBLY_VERSION" \
            -p:InformationalVersion="$INFO_VERSION" \
            -p:SkipWebUIBuild=true

      - name: 打包发布文件
        id: package
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          OUT_DIR="DT_Tools/bin/Release/netstandard2.1"
          # 用户解压到 BepInEx/plugins/ 后得到 plugins/DT_Tools/{dll,WebUI,README...}
          STAGE="stage/DT_Tools"
          mkdir -p "$STAGE"

          DLL_PATH=$(find "$OUT_DIR" -maxdepth 1 -name 'DT_Tools*.dll' | head -n 1)
          if [ -z "$DLL_PATH" ]; then
            echo "::error::未找到编译产物 dll"
            exit 1
          fi
          cp "$DLL_PATH" "$STAGE/DT_Tools.dll"

          # 随主程序集一并发布"信息类"伴生文件：.pdb 调试符号（报 bug 定位行号）、
          # .deps.json 依赖清单、.xml 文档注释。均非运行必需，缺失只提示、不阻断发布。
          for ext in pdb deps.json xml; do
            SRC_FILE="${DLL_PATH%.dll}.${ext}"
            if [ -f "$SRC_FILE" ]; then
              cp "$SRC_FILE" "$STAGE/DT_Tools.${ext}"
              echo "已附带 ${ext}：$(basename "$SRC_FILE")"
            else
              echo "::notice::无 ${ext}（$SRC_FILE），跳过"
            fi
          done

          # Linux 区分大小写：csproj 输出的目录名是 WebUI（不是 WEBUI）
          if [ ! -f "$OUT_DIR/WebUI/js/app.js" ]; then
            echo "::error::输出目录缺少 WebUI/js/app.js（检查前端构建与 csproj CopyToOutputDirectory）"
            exit 1
          fi
          cp -a "$OUT_DIR/WebUI" "$STAGE/"

          # 发布包必带文件：缺失时直接失败，而不是静默跳过
          # （FEATURES.md 已删除，曾因 `|| true` 长期未被发现）
          for f in README.md LICENSE; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少发布必需文件：$f"
              exit 1
            fi
            cp "$f" "$STAGE/"
          done

          # README 引用 images/ 下的截图与二维码；不随包发布则包内 README 图片失效
          if [ ! -d images ]; then
            echo "::error::缺少 images/ 目录（README 引用了其中的图片）"
            exit 1
          fi
          cp -a images "$STAGE/"

          ZIP_NAME="DT_Tools-${TAG}.zip"
          (cd stage && zip -r "../$ZIP_NAME" DT_Tools)

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "Packed layout:"
          unzip -l "$ZIP_NAME" | head -40

      - name: 创建 / 更新 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: DT_Tools ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip_name }}
