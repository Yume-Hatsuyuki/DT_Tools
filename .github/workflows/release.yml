name: Release

# 1) 推送 v*.*.* tag → 编译并发布
# 2) Actions 手动 Run workflow，填入 tag（可基于当前 main 新建 tag）
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号（例如 v1.0.7，也支持 v1.0.7.1）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验发布来源分支
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="${{ github.ref_name }}"
            if [ "$BRANCH" != "main" ]; then
              echo "::error::手动发布必须在 main 上触发，当前分支是「$BRANCH」。"
              exit 1
            fi
          else
            git fetch origin main
            if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
              echo "::error::tag（${GITHUB_REF#refs/tags/}）不在 main 历史中，已阻止发布。"
              exit 1
            fi
          fi

      - name: 确定版本号
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?) ]]; then
            echo "::error::tag 须以 vMAJOR.MINOR.PATCH[.BUILD] 开头（例如 v1.0.0 或 v1.0.0.1），当前为「$TAG」"
            exit 1
          fi
          # 编译用的版本号必须是纯数字（BepInEx / System.Version 不支持后缀），
          # 只取匹配到的 v数字.数字.数字(.数字)? 前缀，后面不管跟什么（-c2 / _b2 / 中文 / 空格等）一律丢弃。
          ASSEMBLY_VERSION="${BASH_REMATCH[1]}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$ASSEMBLY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.410'

      - name: Restore
        run: dotnet restore DT_Tools/DT_Tools.csproj

      - name: Build
        run: |
          dotnet build DT_Tools/DT_Tools.csproj -c Release --no-restore \
            -p:Version=${{ steps.ver.outputs.version }}

      - name: 打包发布文件
        id: package
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="DT_Tools/bin/Release/netstandard2.1"
          # 用户解压到 BepInEx/plugins/ 后得到 plugins/DT_Tools/{dll,WEBUI}
          STAGE="stage/DT_Tools"
          mkdir -p "$STAGE"

          DLL_PATH=$(find "$OUT_DIR" -maxdepth 1 -name 'DT_Tools*.dll' | head -n 1)
          if [ -z "$DLL_PATH" ]; then
            echo "::error::未找到编译产物 dll"
            exit 1
          fi
          cp "$DLL_PATH" "$STAGE/DT_Tools.dll"

          if [ ! -d "$OUT_DIR/WEBUI" ]; then
            echo "::error::输出目录缺少 WEBUI（检查 csproj CopyToOutputDirectory）"
            exit 1
          fi
          cp -a "$OUT_DIR/WEBUI" "$STAGE/"

          cp README.md "$STAGE/" 2>/dev/null || true
          cp FEATURES.md "$STAGE/" 2>/dev/null || true
          cp LICENSE "$STAGE/" 2>/dev/null || true

          ZIP_NAME="DT_Tools-${{ steps.ver.outputs.tag }}.zip"
          (cd stage && zip -r "../$ZIP_NAME" DT_Tools)

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "Packed layout:"
          unzip -l "$ZIP_NAME" | head -40

      - name: 创建 / 更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: DT_Tools ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.zip_name }}
