name: Build

# 日常提交 / PR 编译校验，不创建 Release。
# 正式发布请用 Release 工作流（打 tag 或手动触发）。
on:
  push:
    branches: [main]
    tags-ignore: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 与仓库 global.json / 本地环境对齐
          dotnet-version: '7.0.410'

      - name: Restore
        run: dotnet restore DT_Tools/DT_Tools.csproj

      - name: Build
        run: dotnet build DT_Tools/DT_Tools.csproj -c Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DT_Tools
          path: |
            DT_Tools/bin/Release/netstandard2.1/DT_Tools*.dll
            DT_Tools/bin/Release/netstandard2.1/WEBUI/**
          if-no-files-found: error
