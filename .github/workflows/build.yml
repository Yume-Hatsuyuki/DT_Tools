name: Build

on:
  push:
    branches: [main, 'dev-*']
    tags-ignore: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main, 'dev-*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          package-manager-cache: false
          cache-dependency-path: webui-src/package-lock.json

      - name: Build WebUI
        working-directory: webui-src
        run: |
          npm ci
          npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DT_Tools/DT_Tools.csproj

      - name: Build
        run: dotnet build DT_Tools/DT_Tools.csproj -c Release --no-restore -p:SkipWebUIBuild=true

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="DT_Tools/bin/Release/netstandard2.1"
          ls -la "$OUT_DIR"
          test -n "$(find "$OUT_DIR" -maxdepth 1 -name 'DT_Tools*.dll')" \
            || { echo "::error::未找到编译产物 dll"; exit 1; }
          test -f "$OUT_DIR/WebUI/js/app.js" \
            || { echo "::error::输出目录缺少 WebUI/js/app.js（前端未随插件输出）"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: DT_Tools
          path: |
            DT_Tools/bin/Release/netstandard2.1/DT_Tools*.dll
            DT_Tools/bin/Release/netstandard2.1/DT_Tools*.pdb
            DT_Tools/bin/Release/netstandard2.1/DT_Tools*.deps.json
            DT_Tools/bin/Release/netstandard2.1/DT_Tools*.xml
            DT_Tools/bin/Release/netstandard2.1/WebUI/**
          if-no-files-found: error
