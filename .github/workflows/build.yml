name: Build

# 日常提交 / PR 编译校验，不创建 Release。
# 正式发布请用 Release 工作流（打 tag 或手动触发）。
on:
  push:
    branches: [main]
    tags-ignore: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# 同一分支的多个触发并发时，取消旧运行，避免重复编译占用 runner。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 显式安装并固定 Node 版本（与本地开发环境 Node 24 保持一致）
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          # setup-node v5 起默认启用 package-manager 缓存，与上方 cache: npm 冲突，显式关闭
          package-manager-cache: false
          cache-dependency-path: webui-src/package-lock.json

      # 先于 dotnet build 构建前端：产物写入 DT_Tools/WebUI，
      # 保证 csproj 里 <None Include="WebUI/**"> 在求值时就能看到这些文件。
      - name: Build WebUI
        working-directory: webui-src
        run: |
          npm ci
          npm run build

      # 版本以仓库根目录 global.json 为唯一来源（rollForward=disable，必须精确匹配）。
      # 注意不要再同时写 dotnet-version，否则两个版本都会被安装。
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DT_Tools/DT_Tools.csproj

      # 前端已在上一步显式构建，跳过 csproj 内的 BuildWebUI，避免重复执行 npm
      - name: Build
        run: dotnet build DT_Tools/DT_Tools.csproj -c Release --no-restore -p:SkipWebUIBuild=true

      # 注意：Linux 区分大小写，输出目录名是 WebUI（不是 WEBUI）
      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="DT_Tools/bin/Release/netstandard2.1"
          ls -la "$OUT_DIR"
          test -n "$(find "$OUT_DIR" -maxdepth 1 -name 'DT_Tools*.dll')" \
            || { echo "::error::未找到编译产物 dll"; exit 1; }
          test -f "$OUT_DIR/WebUI/js/app.js" \
            || { echo "::error::输出目录缺少 WebUI/js/app.js（前端未随插件输出）"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: DT_Tools
          path: |
            DT_Tools/bin/Release/netstandard2.1/DT_Tools*.dll
            DT_Tools/bin/Release/netstandard2.1/DT_Tools*.pdb
            DT_Tools/bin/Release/netstandard2.1/DT_Tools*.deps.json
            DT_Tools/bin/Release/netstandard2.1/DT_Tools*.xml
            DT_Tools/bin/Release/netstandard2.1/WebUI/**
          if-no-files-found: error
