<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DT Console · 登录</title>
<style>
  :root {
    --bg: #0c0c0c;
    --card: #141414;
    --border: #2a2a2a;
    --text: #c8c8c8;
    --text-dim: #666;
    --green: #4e9a06;
    --green-bright: #8ae234;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
  }
  .box {
    background: var(--card);
    padding: 28px 24px;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 300px;
  }
  h2 {
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--green-bright);
    font-family: "Cascadia Code", "Consolas", monospace;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .sub {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 18px;
  }
  input {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    font-family: "Cascadia Code", "Consolas", monospace;
    font-size: 13px;
    border-radius: 4px;
    margin-bottom: 12px;
    outline: none;
  }
  input:focus { border-color: var(--green); }
  input::placeholder { color: var(--text-dim); }
  button {
    width: 100%;
    background: var(--green);
    color: #0c0c0c;
    border: none;
    padding: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 4px;
  }
  button:hover { background: var(--green-bright); }
</style>
</head>
<body>
<div class="box">
  <h2>DT CONSOLE</h2>
  <p class="sub">请输入访问密码</p>
  <input type="password" id="p" placeholder="密码" autofocus>
  <button onclick="login()">登录</button>
</div>
<script>
async function login(){
  const v = document.getElementById('p').value;
  const r = await fetch('/login?token='+encodeURIComponent(v),{method:'POST',body:v});
  if(await r.text()==='ok') location.href='/';
  else alert('密码错误');
}
document.getElementById('p').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
</script>
</body>
</html>
