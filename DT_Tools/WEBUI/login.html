<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DT Console · 登录</title>
<link rel="icon" type="image/png" href="/favicon/favicon-96x96.png?v=20260926" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg?v=20260926" />
<link rel="shortcut icon" href="/favicon/favicon.ico?v=20260926" />
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png?v=20260926" />
<meta name="apple-mobile-web-app-title" content="DT_Tools" />
<link rel="manifest" href="/favicon/site.webmanifest?v=20260926" />
<style>
  :root {
    --bg: #0c0c0c;
    --card: #141414;
    --border: #2a2a2a;
    --text: #c8c8c8;
    --text-dim: #666;
    --red: #ff4d6d;
    --green: #4e9a06;
    --green-bright: #8ae234;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
  }
  .box {
    background: var(--card);
    padding: 28px 24px;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 300px;
  }
  h2 {
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--green-bright);
    font-family: "Cascadia Code", "Consolas", monospace;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .sub {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 18px;
  }
  input {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    font-family: "Cascadia Code", "Consolas", monospace;
    font-size: 13px;
    border-radius: 4px;
    margin-bottom: 12px;
    outline: none;
  }
  input:focus { border-color: var(--green); }
  input::placeholder { color: var(--text-dim); }
  button {
    width: 100%;
    background: var(--green);
    color: #0c0c0c;
    border: none;
    padding: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 4px;
  }
  button:hover { background: var(--green-bright); }
  /* 内联错误提示（取代 alert） */
  #err {
    min-height: 18px;
    font-size: 12px;
    color: var(--red);
    text-align: center;
    margin-bottom: 10px;
    font-family: "Cascadia Code", "Consolas", monospace;
  }
</style>
</head>
<body>
<div class="box">
  <h2>DT CONSOLE</h2>
  <p class="sub">请输入访问密码</p>
  <input type="password" id="p" placeholder="密码" autofocus>
  <div id="err"></div>
  <button id="btn">登录</button>
</div>
<script type="module">
  // 密码只走 body（不进 URL / 浏览器历史）；错误内联展示
  const err = document.getElementById('err');
  const input = document.getElementById('p');

  async function login() {
    const v = input.value;
    if (!v) { err.textContent = '请输入密码'; return; }
    document.getElementById('btn').disabled = true;
    err.textContent = '';
    try {
      const r = await fetch('/login', { method: 'POST', body: v });
      if (r.ok && await r.text() === 'ok') {
        location.href = '/';
        return;
      }
      err.textContent = r.status === 401 ? '密码错误' : '登录失败（HTTP ' + r.status + '）';
    } catch {
      err.textContent = '无法连接服务器';
    } finally {
      document.getElementById('btn').disabled = false;
    }
  }

  document.getElementById('btn').addEventListener('click', login);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
