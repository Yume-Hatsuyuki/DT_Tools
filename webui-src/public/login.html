<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DT Console · 登录</title>
<link rel="icon" type="image/png" href="/favicon/favicon-96x96.png?v=20260926" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg?v=20260926" />
<link rel="shortcut icon" href="/favicon/favicon.ico?v=20260926" />
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png?v=20260926" />
<meta name="apple-mobile-web-app-title" content="DT_Tools" />
<link rel="manifest" href="/favicon/site.webmanifest?v=20260926" />
<style>
  :root {
    --bg: #090d1a;
    --card: rgba(13, 17, 30, 0.94);
    --border: rgba(39, 127, 255, 0.30);
    --text: #e6e6e6;
    --text-dim: #6b7689;
    --red: #ff5252;
    --cyan: #277fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 800px at 96% 16%, rgba(84, 206, 216, 0.22), transparent 55%),
      radial-gradient(1400px 900px at 55% 0%, rgba(226, 246, 255, 0.13), transparent 55%),
      radial-gradient(1300px 900px at 0% 116%, rgba(108, 96, 235, 0.28), transparent 55%),
      linear-gradient(115deg, #2c5cb4 0%, #2f6cc0 40%, #3180ba 72%, #3a90b8 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
  }
  .box {
    background: var(--card);
    backdrop-filter: blur(18px) saturate(140%);
    padding: 30px 26px;
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 300px;
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.7);
  }
  h2 {
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--cyan);
    font-family: "Fira Code", "Cascadia Code", "Consolas", monospace;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .sub {
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 18px;
  }
  input {
    width: 100%;
    background: #12141d;
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text);
    padding: 9px 12px;
    font-family: "Fira Code", "Cascadia Code", "Consolas", monospace;
    font-size: 13px;
    border-radius: 6px;
    margin-bottom: 12px;
    outline: none;
  }
  input:focus { border-color: var(--cyan); }
  input::placeholder { color: var(--text-dim); }
  button {
    width: 100%;
    background: var(--cyan);
    color: #04070c;
    border: none;
    padding: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 6px;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.6; cursor: default; }
  /* 内联错误提示（取代 alert） */
  #err {
    min-height: 18px;
    font-size: 12px;
    color: var(--red);
    text-align: center;
    margin-bottom: 10px;
    font-family: "Fira Code", "Cascadia Code", "Consolas", monospace;
  }
</style>
</head>
<body>
<div class="box">
  <h2>DT CONSOLE</h2>
  <p class="sub">请输入访问密码</p>
  <input type="password" id="p" placeholder="密码" autofocus>
  <div id="err"></div>
  <button id="btn">登录</button>
</div>
<script type="module">
  // 密码只走 body（不进 URL / 浏览器历史）；错误内联展示
  const err = document.getElementById('err');
  const input = document.getElementById('p');

  async function login() {
    const v = input.value;
    if (!v) { err.textContent = '请输入密码'; return; }
    document.getElementById('btn').disabled = true;
    err.textContent = '';
    try {
      const r = await fetch('/login', { method: 'POST', body: v });
      if (r.ok && await r.text() === 'ok') {
        location.href = '/';
        return;
      }
      err.textContent = r.status === 401 ? '密码错误' : '登录失败（HTTP ' + r.status + '）';
    } catch {
      err.textContent = '无法连接服务器';
    } finally {
      document.getElementById('btn').disabled = false;
    }
  }

  document.getElementById('btn').addEventListener('click', login);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
